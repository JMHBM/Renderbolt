name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile desktop
        run: python3 -m py_compile desktop/renderbolt desktop/engine3d.py desktop/preview3d.py desktop/studio_ui.py
      - name: CLI help (no Tk)
        run: python3 desktop/renderbolt --help && python3 desktop/renderbolt --version
      - name: Looks are JSON
        run: python3 -c "import json, pathlib; [json.loads(p.read_text()) for p in pathlib.Path('looks').glob('*.json')]"
      - name: Preview styles smoke
        run: |
          pip install numpy pillow
          python3 - <<'PY'
          import numpy as np
          from PIL import Image
          import sys
          sys.path.insert(0, "desktop")
          import preview3d
          import engine3d

          bands = np.linspace(0.08, 0.92, 64).astype(np.float32)
          td = np.sin(np.linspace(0, 14, 1024)).astype(np.float32)
          analysis = {"bands": bands, "time": td, "pulse": 0.35, "bass": 0.22}
          styles = [
              "Waveform", "EQ bars", "Circular", "Liquid waves",
              "Levels", "Particles", "Spine", "Radial wave",
          ]
          theme = ("#156a96", "#b8ecff")
          place = {"x": 0, "y": 0, "rot": 0, "sx": 1, "sy": 1, "mirror": False}
          for style in styles:
              img = Image.new("RGBA", (320, 180), (10, 10, 12, 255))
              preview3d.draw_lite(img, analysis, style, theme, 0.8, place)
              img = Image.new("RGBA", (320, 180), (10, 10, 12, 255))
              preview3d.draw_visualizer(img, analysis, style, theme, 0.8, 0.4, 42, "2D", place, 0.2)
              preview3d.draw_visualizer(img, analysis, style, theme, 0.8, 0.4, 42, "3D", place, 0.2)

          class Dummy:
              pass
          d = Dummy()
          d._cube_pos, d._cube_n, _ = engine3d._cube()
          p, s = (0.08, 0.28, 0.55), (0.72, 0.9, 1.0)
          for name in ("_mesh_levels", "_mesh_particles", "_mesh_spine"):
              pos, nrm, col = getattr(engine3d.VisualEngine3D, name)(d, bands, p, s)
              assert pos.shape[0] > 0, name
          pos, *_ = engine3d.VisualEngine3D._mesh_radial_wave(d, bands, 0.2, p, s)
          assert pos.shape[0] > 0
          for name in ("_mesh_2d_levels", "_mesh_2d_particles", "_mesh_2d_spine"):
              pos, *_ = getattr(engine3d.VisualEngine3D, name)(d, bands, p, s)
              assert pos.shape[0] > 0, name
          pos, *_ = engine3d.VisualEngine3D._mesh_2d_radial(d, bands, 0.2, p, s)
          assert pos.shape[0] > 0
          silent = {"bands": np.zeros(32, dtype=np.float32), "time": np.zeros(8, dtype=np.float32), "pulse": 0.0}
          img = Image.new("RGBA", (64, 36), (0, 0, 0, 255))
          preview3d.draw_lite(img, silent, "Levels", theme, 0.8, {})
          dark = Image.new("RGBA", (320, 180), (10, 10, 11, 255))
          preview3d.draw_lite(dark, analysis, "Waveform", ("#000000", "#111111"), 0.95, place)
          assert max(dark.getextrema()[i][1] for i in range(3)) > 40, "dark waveform invisible"
          print("styles-ok", ",".join(styles))
          PY

